syntax = "proto2";

package GDI.Proto.ConnectIQInstalledApps;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";

enum AppType {
    UNKNOWN_APP_TYPE = 0;
    WATCH_APP = 1;
    WIDGET = 2;
    WATCH_FACE = 3;
    DATA_FIELD = 4;
    ALL = 5;
    NONE = 6;
    AUDIO_CONTENT_PROVIDER = 7;
    ACTIVITY = 8;
}

message ConnectIQInstalledAppsService {
    optional GetInstalledAppsRequest get_installed_apps_request = 1;
    optional GetInstalledAppsResponse get_installed_apps_response = 2;
    optional DeleteAppRequest delete_app_request = 3;
    optional DeleteAppResponse delete_app_response = 4;
    optional UpdateInstalledAppsRequest update_installed_app_request = 5;
    optional UpdateInstalledAppsResponse update_installed_app_response = 6;
    optional EnableNativeAppRequest enable_native_app_request = 7;
    optional EnableNativeAppResponse enable_native_app_response = 8;
    optional LaunchAppRequest launch_app_request = 9;
    optional LaunchAppResponse launch_app_response = 10;
    optional UpdateFaceItProjectIdMappingsRequest update_faceit_project_id_mappings_request = 11;
    optional UpdateFaceItProjectIdMappingsResponse update_faceit_project_id_mappings_response = 12;
    optional PendingAppInstallRequest pending_app_install_request = 13;
    optional PendingAppInstallResponse pending_app_install_response = 14;
}

message DeleteAppRequest {
    optional bytes store_app_id = 1;
    optional AppType app_type = 2;
}

message DeleteAppResponse {
    enum Status {
        UNKNOWN_STATUS = 0;
        OK = 1;
        FAILED_TO_DELETE = 2;
    }
    optional Status status = 1;
}

message EnableNativeAppRequest {
    optional uint32 native_app_id = 1;
    optional AppType app_type = 2;
    optional bytes app_id = 3;
}

message EnableNativeAppResponse {
    enum Status {
        UNKNOWN_STATUS = 0;
        OK = 1;
        INVALID_NATIVE_APP = 2;
    }
    optional Status status = 1;
}

message GetInstalledAppsRequest {
    optional AppType app_type = 1;
}

message GetInstalledAppsResponse {
    message InstalledApp {
        optional bytes store_app_id = 1;
        optional AppType app_type = 2;
        optional string name = 3;
        optional bool disabled = 4;
        optional uint32 version = 5;
        optional string filename = 6;
        optional uint64 filesize = 7;
        optional uint32 native_app_id = 8;
        optional bool favorite = 9;
        optional string faceit_project_id = 10;
    }
    optional uint64 available_space = 1;
    optional uint32 available_slots = 2;
    repeated InstalledApp installed_app = 3;
}

message LaunchAppRequest {
    enum StartUpMode {
        APP_STARTUP_MODE_NORMAL = 0;
        APP_STARTUP_MODE_MEDIA_PLAYBACK_CONFIGURATION = 1;
        APP_STARTUP_MODE_MEDIA_SYNC_CONFIGURATION = 2;
        APP_STARTUP_MODE_NO_UI = 3;
    }
    optional bytes app_uuid = 1;
    optional StartUpMode app_startup_mode = 2;
}

message LaunchAppResponse {
    enum Status {
        LAUNCH_STATUS_SUCCESS = 0;
        LAUNCH_STATUS_APP_ALREADY_RUNNING = 1;
        LAUNCH_STATUS_APP_NOT_INSTALLED = 2;
        LAUNCH_STATUS_UNKNOWN_ERROR = 3;
    }
    optional Status status = 1;
}

message PendingAppInstallRequest {
    optional AppType app_type = 1;
    optional bytes store_app_id = 2;
    optional bytes app_uuid = 3;
    optional string name = 4;
}

message PendingAppInstallResponse {
    enum Status {
        SUCCESS = 0;
        FAIL = 1;
        NO_CIQ_SUPPORT = 2;
        ALREADY_INSTALLED = 3;
        NO_SPACE = 4;
    }
    optional Status status = 1;
}

message UpdateFaceItProjectIdMappingsRequest {
    optional string slot_1 = 1;
    optional string slot_2 = 2;
    optional string slot_3 = 3;
}

message UpdateFaceItProjectIdMappingsResponse {
    enum Status {
        SUCCESS = 0;
        NO_CHANGE = 1;
        FAIL = 2;
    }
    optional Status slot_1_status = 1;
    optional Status slot_2_status = 2;
    optional Status slot_3_status = 3;
}

message UpdateInstalledAppsRequest {
    message InstalledApp {
        optional bytes app_id = 1;
        optional AppType app_type = 2;
        optional bool disabled = 3;
        optional bool favorite = 4;
    }
    repeated InstalledApp installed_app = 1;
}

message UpdateInstalledAppsResponse {
    enum Status {
        UNKNOWN_STATUS = 0;
        OK = 1;
        FAILED_TO_UPDATE = 2;
    }
    optional Status status = 1;
}

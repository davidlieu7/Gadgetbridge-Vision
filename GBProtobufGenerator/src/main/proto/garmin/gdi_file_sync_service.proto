syntax = "proto2";

package garmin_vivomovehr;

option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";

message FileSyncService {
  optional PullItemRequest pull_item_request = 1;
  optional PullItemResponse pull_item_response = 2;
  optional PushItemRequest push_item_request = 3;
  optional PushItemResponse push_item_response = 4;
  optional TransferStatusRequest transfer_status_request = 5;
  optional PriorityUpdateResponse priority_update_response = 7;
  optional ItemListRequest item_list_request = 9;
  optional ItemListResponse item_list_response = 10;
  optional ItemListCancelNotification item_list_cancel_notification = 11;
  optional ItemAddedNotification item_added_notification = 12;
  optional DeleteItemRequest delete_item_request = 13;
  optional DeleteItemResponse delete_item_response = 14;
  optional ModifyFlagsRequest modify_flags_request = 15;
  optional ModifyFlagsResponse modify_flags_response = 16;
  optional ItemUpdatedNotification item_updated_notification = 17;
  optional CancelTransferRequest cancel_transfer_request = 18;
  optional CancelTransferResponse cancel_transfer_response = 19;
  optional ResourceUpdateNotification resource_update_notification = 20;
  optional TransferStatusResponse transfer_status_response = 21;
  optional SyncButtonNotification sync_button_notification = 22;
  optional SoftwareUpdatePartNumberRequest software_update_part_number_request = 23;
  optional SoftwareUpdatePartNumberResponse software_update_part_number_response = 24;
  optional GetItemChecksumRequest get_item_checksum_request = 25;
  optional GetItemChecksumResponse get_item_checksum_response = 26;
}

message ItemListCancelNotification{
}

// Reserves a transfer slot for a PRG upload via MLR. The response contains the token for the control
// message that the upload starts with.
message PushItemRequest {
  optional File file = 1;
  optional uint32 unk2 = 2; // 24, 34 or 37, does not seem related to the app type
  optional uint32 unk3 = 3; // 0
  optional uint32 requested_compression_window = 4; // 15
}

message DeleteItemRequest {
    optional FileId file = 1;
    optional uint32 unk_2 = 2;
}

message CancelTransferRequest {
}

message SoftwareUpdatePartNumberRequest {
}

message GetItemChecksumRequest {
}

message GetItemChecksumResponse {
}

message PushItemResponse {
    optional uint32 status = 1; // 0=success
    optional uint32 unk2 = 2; // 0
    optional uint32 unk3 = 3; // 0
    optional uint32 token = 4;
    optional uint32 error_code = 6;
    optional uint32 error_source = 7;
    optional uint32 compression_window = 8; // 10
}

message PriorityUpdateResponse {
    optional uint32 unk1 = 1;
}

message DeleteItemResponse {
    optional uint32 status = 1; // 0=success
    optional uint32 error_code = 2;
    optional uint32 error_source = 3;
}

message CancelTransferResponse {
    optional uint32 unk1 = 1;
}

message SoftwareUpdatePartNumberResponse {
}

message ResourceUpdateNotification {
  optional uint32 unk1 = 1;
  optional uint32 unk2 = 2;
}

message ModifyFlagsResponse {
  optional uint32 status = 1; // 0: success
  optional uint32 error_code = 2;
  optional uint32 error_source = 3;
}

message TransferStatusRequest {
  optional FileId uid = 1;
  optional uint32 handle = 2;
}

message TransferStatusResponse {
  optional uint32 unk1 = 1;
}

message SyncButtonNotification {
  // user pressed button on device to start syncing files
}

message ItemAddedNotification {
  repeated File file = 1;
  optional uint32 unk2 = 2; // 24
  optional uint32 unk3 = 3; // 0
  optional uint32 unk4 = 4; // 0
  optional uint32 unk5 = 5; // 15
  optional uint32 unk6 = 6; // 1
}

message ModifyFlagsRequest {
  optional FileId file = 1;
  optional FileId set_flags = 2;
  optional FileId remove_flags = 3;
}

message ItemUpdatedNotification {
  optional FileId file = 1;
  optional FileId flags_set = 2;
  optional FileId flags_removed = 3;
}

message PullItemRequest {
  optional File file = 1;
  optional uint32 unk2 = 2; // 24
  optional uint32 unk3 = 3; // 0
  optional uint64 offset = 4;
  optional uint32 requested_compression_window = 5; // 15
}

message PullItemResponse {
  optional uint32 status = 1; // 0 success 3 failure
  optional uint32 unk2 = 2; // 0
  optional uint32 handle = 3; // varies
  optional sint32 error_code = 5;
  optional uint32 error_source = 6;
  optional uint32 compression_window = 7; // 11
  optional uint32 unk8 = 8; // error related
  optional sint32 unk9 = 9; // error related
}

message ItemListRequest {
  // Set to FileListResponse.cursor_id to continue an in-progress listing.
  // Mutually exclusive with start_page_id: only set one of the two.
  optional uint32 cursor_id = 1;
  optional uint32 start_page_id = 2; // 33737
  optional uint32 max_count = 3; // maximum per FileListResponse, not total max
  // Exclusion flags? If we omit this, it sends back already synced files going back months.
  // 0x000000000000a5a5 / 42405 appears to be the "already synced" flag.
  repeated FileId flags1 = 4;
  repeated FileId flags2 = 5; // 0x000000000000a5a5 / 42405
  repeated FileType types = 6;
  repeated uint32 include_metadata = 7; // 0: include File.timestamp
}

message ItemListResponse {
  optional uint32 status = 1; // 0 - OK
  // Present when more items are pending for *this* listing (> 100 items) - send it back
  // on the next FileListRequest.cursor_id to get the remaining items.
  // Mutually exclusive with next_page_id: only one of the two is set.
  optional uint32 cursor_id = 2; // 2 on venu 4, 1 on venu 3
  optional uint32 next_page_id = 3; // 33737, incrementing
  repeated File file = 4;
  optional uint32 error_code = 5;
  optional uint32 unk6 = 6; // 1 on venu 4
  optional FileType unk7 = 7; // error related
}

message File {
  optional FileId id = 1;
  optional FileType type = 2;
  optional uint64 size = 3;
  optional uint32 page_id = 5; // 33652, 33653, ... incrementing
  optional uint32 unk4 = 4; // 0 on venu 4
  optional uint32 unk6 = 6; // 2 on venu 4
  optional uint32 timestamp = 7;
}

message FileId {
  optional fixed64 id1 = 1;
  optional fixed64 id2 = 2;
}

message FileType {
  optional uint32 code = 1; // 0 fit, 3 binary
  optional string name = 2;
  optional uint32 name_id = 3; // id-name-mapping is ephemeral
}

syntax = "proto2";

package GDI.Proto.LiveSession;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin.GdiLaunchMonitorService";
option java_outer_classname = "GdiLiveSession";

import "garmin/gdi_data_types.proto";

message ActivityStartRequest {
    optional GDI.Proto.DataTypes.UUID uuid = 1;
    optional SportProfile sport_profile = 2;
    optional GDI.Proto.DataTypes.UUID workout_file_uid = 3;
    repeated  Zones zones = 4;
    optional Target target = 5;
    optional WorkoutSession workout_session = 6;
    repeated  PowerCurveEntry power_curve_entries = 7;
    optional uint32 ftp = 8;
}

message ActivityStateRequest {
    enum EndReason {
        SAVED = 0;
        DISCARDED = 1;
    }
    enum State {
        START = 0;
        STOP = 1;
        PAUSE = 2;
        RESUME = 3;
        ENDED = 4;
        SAVING = 5;
        DISCARDING = 6;
        WORKOUT_ENDED = 7;
        WORKOUT_WARMUP = 8;
        WORKOUT_ACTIVE = 9;
        WORKOUT_REST = 10;
        WORKOUT_COOLDOWN = 11;
    }
    optional ActivityStateRequest.State state = 1;
    optional ActivityStateRequest.EndReason end_reason = 2;
}

message AdvanceWorkoutRequest {
}

message AdvanceWorkoutResponse {
}

message AppInitiatedActivityCommandRequest {
    enum Command {
        INITIAL_START = 0;
        RESUME = 1;
        PAUSE = 2;
        SAVE = 3;
        DISCARD = 4;
    }
    optional SportProfile sport_profile = 1;
    optional AppInitiatedActivityCommandRequest.Command command = 2;
    optional uint32 workout_id = 3;
}

message AppInitiatedActivityCommandResponse {
    enum FailureReason {
        UNKNOWN = 1;
    }
    optional AppInitiatedActivityCommandResponse.FailureReason failure = 1;
}

message AutodetectExerciseSuggestion {
    optional uint32 exercise_category = 1;
    optional uint32 exercise_subcategory = 2;
    optional uint32 confidence = 3;
}

message CancelFinalizeTimerRequest {
}

message CancelFinalizeTimerResponse {
}

message DataNotification {
    repeated  Metric metrics = 1;
    repeated  LastSetMetrics last_set_metrics = 2;
}

message DeleteRepRequest {
    optional uint32 step_index = 1;
    repeated uint32 rep_index = 2;
}

message DeleteRepResponse {
    enum DeleteResult {
        Success = 1;
        Failed = 2;
    }
    optional DeleteRepResponse.DeleteResult result = 1;
}

message DeleteWorkoutRequest {
    optional uint32 workout_id = 1;
}

message DeleteWorkoutResponse {
}

message FinalizeSetRequest {
    optional uint32 stepIndex = 1;
    optional uint32 reps = 2;
    optional float weight = 3;
    optional GDI.Proto.DataTypes.MeasurementUnit weight_unit = 4;
    optional uint32 timeout = 5;
    repeated  AutodetectExerciseSuggestion exercise_suggestions = 6;
}

message IntensityTarget {
    enum Priority {
        Primary = 0;
        Secondary = 1;
    }
    optional IntensityTarget.Priority prority = 1;
    optional uint32 type = 2;
    optional float float_val = 3;
    optional Range range_val = 4;
}

message LapButtonRequest {
}

message LapButtonResponse {
}

message LastSetMetrics {
    repeated  Metric metrics = 1;
}
message LiveSessionEventNotification {
    optional ActivityStartRequest activity_start_request = 1;
    optional ActivityStateRequest activity_state_request = 2;
    optional DataNotification data_notification = 3;
    optional WorkoutStepStartedRequest workout_step_started_request = 4;
    optional FinalizeSetRequest finalize_set_request = 5;
    optional CancelFinalizeTimerRequest cancel_finalize_timer_request = 6;
    optional SetConfigurationRequest set_configuration_request = 7;
    optional XcelSprintStateRequest xcel_sprint_state_request = 8;
}

message LiveSessionService {
    optional MetricConfigurationRequest metric_configuration_request = 1;
    optional MetricConfigurationResponse metric_configuration_response = 2;
    optional LapButtonRequest lap_request = 3;
    optional LapButtonResponse lap_response = 4;
    optional StartStopButtonRequest start_stop_request = 5;
    optional StartStopButtonResponse start_stop_response = 6;
    optional AdvanceWorkoutRequest advance_workout_request = 7;
    optional AdvanceWorkoutResponse advance_workout_response = 8;
    optional SetConfigurationRequest set_configuration_request = 9;
    optional SetConfigurationResponse set_configuration_response = 10;
    optional CancelFinalizeTimerRequest cancel_finalize_timer_request = 11;
    optional CancelFinalizeTimerResponse cancel_finalize_timer_response = 12;
    optional ModifyWorkoutRequest modify_workout_request = 13;
    optional ModifyWorkoutResponse modify_workout_response = 14;
    optional WorkoutModifiedRequest workout_modified_request = 15;
    optional WorkoutModifiedResponse workout_modified_response = 16;
    optional AppInitiatedActivityCommandRequest app_initiated_activity_command_request = 17;
    optional AppInitiatedActivityCommandResponse app_initiated_activity_command_response = 18;
    optional WorkoutListRequest workout_list_request = 19;
    optional WorkoutListResponse workout_list_response = 20;
    optional WorkoutRequest workout_request = 21;
    optional WorkoutResponse workout_response = 22;
    optional DeleteWorkoutRequest delete_workout_request = 23;
    optional DeleteWorkoutResponse delete_workout_response = 24;
    optional XcelSprintCommandRequest xcel_sprint_command_request = 25;
    optional XcelSprintCommandResponse xcel_sprint_command_response = 26;
    optional SetMetricsRequest set_metrics_request = 27;
    optional SetMetricsResponse set_metrics_response = 28;
    optional DeleteRepRequest delete_rep_request = 29;
    optional DeleteRepResponse delete_rep_response = 30;
}

message Metric {
    optional uint32 timestamp = 1;
    optional uint32 type = 2;
    optional float float_val = 3;
    optional int32 int_val = 4;
    optional string string_val = 5;
    optional GDI.Proto.DataTypes.MeasurementUnit measurement_unit = 6;
    repeated float float_arr = 7;
}

message MetricConfigurationRequest {
    repeated uint32 requested_types = 1;
}

message MetricConfigurationResponse {
    repeated uint32 types = 1;
}

message ModifyWorkoutRequest {
    optional uint32 skipped_cluster_id = 1;
    optional uint32 deleted_cluster_id = 2;
    optional uint32 start_now_cluster_id = 3;
    optional uint32 add_cluster_id = 4;
}

message ModifyWorkoutResponse {
    repeated uint32 active_clusters = 1;
    repeated uint32 skipped_clusters = 2;
}

message PowerCurveEntry {
    optional uint32 power = 1;
    optional uint32 duration = 2;
}

message Range {
    optional float high = 1;
    optional float low = 2;
}

message RepMetrics {
    repeated  Metric metrics = 1;
}

message SetConfigurationRequest {
    optional uint32 stepIndex = 1;
    optional uint32 reps = 2;
    optional float weight = 3;
    optional GDI.Proto.DataTypes.MeasurementUnit weight_unit = 4;
    optional uint32 exercise_category = 5;
    optional uint32 exercise_subcategory = 6;
    optional bool configure_next_set = 7;
    repeated  IntensityTarget intensity_target = 8;
    optional uint32 rest_timer = 9;
}

message SetConfigurationResponse {
}

message SetMetricsRequest {
    optional uint32 step_index = 1;
    repeated uint32 requested_types = 2;
}

message SetMetricsResponse {
    optional uint32 step_index = 1;
    repeated  RepMetrics set_metrics = 2;
}

message SportProfile {
    optional uint32 sport_fit_type = 1;
    optional uint32 sport_fit_sub_type = 2;
    optional string name = 3;
    optional uint32 accent_color = 4;
}

message StartStopButtonRequest {
}

message StartStopButtonResponse {
}

message Target {
    optional uint32 distance = 1;
    optional uint32 speed = 2;
    optional uint32 time = 3;
    optional uint32 reps = 4;
}

message WorkoutInfo {
    enum Type {
        SCHEDULED = 0;
        NORMAL = 1;
    }
    optional string name = 1;
    optional WorkoutInfo.Type type = 2;
    optional uint32 workout_id = 3;
    optional uint32 scheduled_time = 4;
}

message WorkoutListRequest {
}

message WorkoutListResponse {
    repeated  WorkoutInfo list = 1;
    optional bool list_limit_reached = 2;
}

message WorkoutModifiedRequest {
    repeated uint32 active_clusters = 1;
    repeated uint32 skipped_clusters = 2;
}

message WorkoutModifiedResponse {
}

message WorkoutRequest {
    optional uint32 workout_id = 1;
}

message WorkoutResponse {
    optional GDI.Proto.DataTypes.UUID workout_file_uid = 1;
}

message WorkoutSession {
    enum Type {
        OPEN_REPEAT = 0;
        STRUCTURED_REPEAT = 1;
        TARGET_WORKOUT = 2;
        STRUCTURED_WORKOUT = 3;
        HIIT_TIMER = 4;
    }
    optional WorkoutSession.Type type = 1;
    optional bool has_warmup_start = 2;
}

message WorkoutStepStartedRequest {
    optional uint32 step_id = 1;
    optional uint32 current_repeat = 2;
    optional uint32 total_repeats = 3;
}

message XcelSprintCommandRequest {
    enum Command {
        RESERVE_LANE = 0;
        UNRESERVE_LANE = 1;
        START_MEASURE = 2;
        STOP_MEASURE = 3;
    }
    optional XcelSprintCommandRequest.Command command = 1;
}

message XcelSprintCommandResponse {
    enum FailureReason {
        UNKNOWN = 1;
        INVALID_COMMAND = 2;
        INVALID_STATE = 3;
        INVALID_ARGUMENT = 4;
    }
    optional XcelSprintCommandResponse.FailureReason reason = 1;
}

message XcelSprintStateRequest {
    enum Reason {
        LANES_FULL = 1;
        UWB_ERROR = 2;
        CONNECTION_LOST = 3;
        OUT_OR_RANGE = 4;
        NO_SPACE_ON_SENSOR = 5;
        INCOMPATIBLE_SOFTWARE = 6;
        BASE_RESTRICTED = 7;
        CONNECTION_TIMED_OUT = 8;
    }
    enum SessionType {
        OWNER = 0;
        GUEST = 1;
        COACH = 2;
    }
    enum Source {
        BASE = 1;
        SENSOR = 2;
        LIVE_SESSION = 3;
        CLIPBOARD = 4;
    }
    enum State {
        UNKNOWN = 0;
        ASSOCIATION = 1;
        RELEASED = 2;
        RESERVING = 3;
        RESERVED = 4;
        START_POSITION = 5;
        COUNTDOWN = 6;
        ACTIVE = 7;
        PROCESSING = 8;
        MEASURE = 9;
    }
    optional XcelSprintStateRequest.State state = 1;
    optional XcelSprintStateRequest.Source source = 2;
    optional XcelSprintStateRequest.Reason reason = 3;
    optional XcelSprintStateRequest.SessionType sessionType = 4;
}

message Zones {
    enum Type {
        HR = 0;
        POWER = 1;
    }
    optional Zones.Type type = 1;
    repeated uint32 high_values = 2;
}

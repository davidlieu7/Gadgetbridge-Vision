syntax = "proto2";

package GDI.Proto.DeviceStatus;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiDeviceStatus";

enum PasscodeResponseStatus {
    PASSCODE_STATUS_ERROR = 0;
    PASSCODE_STATUS_OK = 1;
    PASSCODE_STATUS_NFC_DEVICE = 2;
}

enum RemoteDeviceBatteryStatusBatteryStatus {
    UNKNOWN_STATUS = 0;
    NORMAL = 1;
    LOW = 2;
    CRITICAL = 3;
    CHARGING = 4;
    FULLY_CHARGED = 5;
    ERROR = 6;
}

message AppInitiatedPasscodeSetNotification {
    enum Source {
        GARMIN_PAY = 0;
        DEVICE_SETTINGS = 1;
    }
    optional Source source = 1;
}

message DevicePasscodeInvalidAttemptNotification {
    optional uint32 attempts_remaining = 1;
}

message DeviceStatusService {
    optional RemoteDeviceBatteryStatusChangedNotification remote_device_battery_status_changed_notification = 1;
    optional RemoteDeviceBatteryStatusRequest remote_device_battery_status_request = 2;
    optional RemoteDeviceBatteryStatusResponse remote_device_battery_status_response = 3;
    optional GetCurrentActivityStatusRequest activity_status_request = 4;
    optional GetCurrentActivityStatusResponse activity_status_response = 5;
    optional GetInitialSetupStatusRequest initial_setup_status_request = 6;
    optional GetInitialSetupStatusResponse initial_setup_status_response = 7;
    optional DevicePasscodeInvalidAttemptNotification device_passcode_invalid_attempt_notification = 8;
    optional DeviceUnlockedNotification device_unlocked_notification = 9;
    optional SetDevicePasscodeRequest set_device_passcode_request = 10;
    optional SetDevicePasscodeResponse set_device_passcode_response = 11;
    optional AppInitiatedPasscodeSetNotification app_initiated_passcode_set_notification = 12;
    optional ResetPasscodeRequest reset_passcode_request = 13;
    optional ResetPasscodeResponse reset_passcode_response = 14;
    optional RegionRequiresPasscodeNotification region_requires_passcode_notification = 15;
}

message DeviceUnlockedNotification {
}

message GetCurrentActivityStatusRequest {
}

message GetCurrentActivityStatusResponse {
    enum ActivityStatus {
        OFF = 0;
        STOPPED = 1;
        PAUSED = 2;
        ON = 3;
    }
    optional ActivityStatus activity_status = 1;
}

message GetInitialSetupStatusRequest {
}

message GetInitialSetupStatusResponse {
    enum InitialSetupStatus {
        IN_INITIAL_SETUP = 0;
        SETUP_COMPLETE = 1;
        IN_SETUP_APPLYING_BACKUP = 2;
    }
    optional InitialSetupStatus initial_setup_status = 1;
}

message RegionRequiresPasscodeNotification {
}

message RemoteDeviceBatteryStatusChangedNotification {
    optional RemoteDeviceBatteryStatusBatteryStatus status = 1;
}

message RemoteDeviceBatteryStatusRequest {
}

message RemoteDeviceBatteryStatusResponse {
    enum ResponseStatus {
        UNKNOWN_RESPONSE_STATUS = 0;
        OK = 1;
        NO_REMOTE_DEVICE = 2;
    }
    optional ResponseStatus status = 1;
    optional uint32 current_battery_level = 2;
    optional RemoteDeviceBatteryStatusBatteryStatus battery_status = 3;
    optional uint32 estimated_hours_remaining = 4;
}

message ResetPasscodeRequest {
}

message ResetPasscodeResponse {
    optional PasscodeResponseStatus response_status = 1;
}

message SetDevicePasscodeRequest {
    optional string passcode = 1;
}

message SetDevicePasscodeResponse {
    optional PasscodeResponseStatus response_status = 1;
}

syntax = "proto2";

package garmin_vivomovehr;

option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin.GdiSmartProto";
option java_multiple_files = true;

import "garmin/gdi_accessory_utilities.proto";
import "garmin/gdi_app_settings.proto";
import "garmin/gdi_audio_prompts.proto";
import "garmin/gdi_calendar.proto";
import "garmin/gdi_core.proto";
import "garmin/gdi_credentials.proto";
import "garmin/gdi_data_transfer.proto";
import "garmin/gdi_deep_linking.proto";
import "garmin/gdi_device_messages.proto";
import "garmin/gdi_device_status.proto";
import "garmin/gdi_ecg_service.proto";
import "garmin/gdi_event_sharing.proto";
import "garmin/gdi_explore_sync.proto";
import "garmin/gdi_file_access.proto";
import "garmin/gdi_find_my_watch.proto";
import "garmin/gdi_garmin_connect.proto";
import "garmin/gdi_generic_item_transfer.proto";
import "garmin/gdi_gncs.proto";
import "garmin/gdi_group_live_track.proto";
import "garmin/gdi_http.proto";
import "garmin/gdi_incident_detection.proto";
import "garmin/gdi_in_reach_contact_sync.proto";
import "garmin/gdi_in_reach_tracking.proto";
import "garmin/gdi_installed_apps.proto";
import "garmin/gdi_instant_input.proto";
import "garmin/gdi_launch_monitor.proto";
import "garmin/gdi_live_session.proto";
import "garmin/gdi_live_track.proto";
import "garmin/gdi_realtime_settings.proto";
import "garmin/gdi_running.proto";
import "garmin/gdi_simple_setup.proto";
import "garmin/gdi_sms_notification.proto";
import "garmin/gdi_waypoint_transfer.proto";
import "garmin/gdi_wifi_setup.proto";

message Smart {
    optional GDI.Proto.Calendar.CalendarService calendar_events_service = 1;
    optional GDI.Proto.ConnectIQHTTP.ConnectIQHTTPService connect_iq_http_service = 2;
    optional GDI.Proto.ConnectIQInstalledApps.ConnectIQInstalledAppsService connect_iq_installed_apps_service = 3;
    optional GDI.Proto.ConnectIQAppSettings.ConnectIQAppSettingsService connect_iq_app_settings_service = 4;
    optional GDI.Proto.DataTransfer.DataTransferService data_transfer_service = 7;
    optional GDI.Proto.DeviceStatus.DeviceStatusService device_status_service = 8;
    optional GDI.Proto.IncidentDetection.IncidentDetectionService incident_detection_service = 9;
    optional GDI.Proto.AudioPrompts.AudioPromptsService audio_prompts_service = 10;
    optional GDI.Proto.WifiSetup.WifiSetupService wifi_setup_service = 11;
    optional GDI.Proto.FindMyWatch.FindMyWatchService find_my_watch_service = 12;
    optional GDI.Proto.Core.CoreService core_service = 13;
    optional GDI.Proto.GroupLiveTrack.GroupLiveTrackService group_live_track_service = 14;
    optional GDI.Proto.SmsNotification.SmsNotificationService sms_notification_service = 16;
    optional GDI.Proto.InstantInput.InstantInputService instant_input_service = 18;
    optional GDI.Proto.LiveTrack.LiveTrackService live_track_service = 21;
    optional ExploreSyncService explore_sync_service = 22;
    optional GDI.Proto.WaypointTransfer.WaypointTransferService way_point_transfer_service = 23;
    optional GDI.Proto.DeviceMessages.DeviceMessageService device_message_service = 24;
    optional GDI.Proto.Credentials.CredentialsService credentials_service = 27;
    optional GDI.Proto.InReachTracking.InReachTrackingService inreach_tracking_service = 28;
    optional InReachMessagingService inreach_messaging_service = 29;
    optional GDI.Proto.EventSharing.EventSharingService event_sharing = 30;
    optional GDI.Proto.GenericItemTransfer.GenericItemTransferService generic_item_transfer_service = 31;
    optional GDI.Proto.InReachContactSync.InReachContactSyncService inreach_contact_sync_service = 32;
    optional GDI.Proto.SimpleSetup.SimpleSetupService simple_setup_service = 36;
    optional GDI.Proto.LaunchMonitor.Service launch_monitor_service = 38;
    optional EcgService samd_service = 39;
    optional RealtimeSettingsService realtime_settings_service = 42;
    optional GDI.Proto.FileAccess.Service file_access_service = 43;
    optional Service44 service44 = 44;
    optional GDI.Proto.DeepLinking.DeepLinkingService deeplinking_service = 46;
    optional GDI.Proto.GarminConnect.Service garmin_connect_service = 47;
    optional GDI.Proto.GNCS.Service gncs_service = 49;
    optional GDI.Proto.LiveSession.LiveSessionService live_session_service = 56;
    optional GDI.Proto.Running.Service running_service = 62;
    optional GDI.Proto.AccessoryUtilities.Service accessory_utilities_service = 63;
}

message UUID {
    required fixed64 upper = 1;
    required fixed64 lower = 2;
}

message InReachMessagingService {
    message Message2 {
        message Message1 {
            message Message12 {
                optional uint32 unk1 = 1;
                optional uint32 unk3 = 3;
                optional uint32 unk7 = 7;
            }
            optional uint32 unk1 = 1;
            optional uint32 unk2 = 2;
            optional uint32 unk3 = 3;
            repeated Message12 unk12 = 12;
        }
        optional Message1 unk1 = 1;
    }
    message Message4 {
        message Message4x {
            optional uint32 unk1 = 1;
        }
        optional uint32 unk1 = 1;
        optional Message4x unk4 = 4;
        optional uint32 unk9 = 9;
        optional uint32 unk10 = 10;
        optional string unk11 = 11;
        optional UUID unk12 = 12;
        optional UUID unk13 = 13;
        optional uint32 unk14 = 14;
        optional uint32 unk15 = 15;
        optional string unk17 = 17; // model?
        optional uint64 unk18 = 18; // serial?
    }
    message Message6 {
        optional uint32 unk1 = 1;
    }
    message Message14 {
        optional uint32 unk1 = 1;
    }
    message Message18 {
        optional uint32 unk1 = 1;
    }
    message Message25 {
        optional uint32 unk1 = 1;
    }
    message Message41 {
        optional uint32 unk1 = 1;
    }
    message Message43 {
        optional uint32 unk1 = 1;
    }
    message Message45 {
    }
    optional Message2 unk2 = 2;
    optional Message4 unk4 = 4;
    optional Message6 unk6 = 6;
    optional Message14 unk14 = 14;
    optional Message18 unk18 = 18;
    optional Message25 unk25 = 25;
    optional Message41 unk41 = 41;
    optional Message43 unk43 = 43;
    optional Message45 unk45 = 45;
}

message Service44 {
    message Message2 {
        optional uint32 unk1 = 1;
    }
    optional Message2 unk2 = 2;
}

syntax = "proto2";

package GDI.Proto.LaunchMonitor;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin.GdiLaunchMonitorService";
option java_outer_classname = "GdiLaunchMonitor";

message LaunchMonitorService {
    optional StatusRequest status_request = 1;
    optional StatusResponse status_response = 2;
    optional WakeUpRequest wake_up_request = 3;
    optional WakeUpResponse wake_up_response = 4;
    optional TiltRequest tilt_request = 5;
    optional TiltResponse tilt_response = 6;
    optional StartTiltCalibrationRequest start_tilt_cal_request = 7;
    optional StartTiltCalibrationResponse start_tilt_cal_response = 8;
    optional ResetTiltCalibrationRequest reset_tilt_cal_request = 9;
    optional ResetTiltCalibrationResponse reset_tilt_cal_response = 10;
    optional ShotConfigRequest shot_config_request = 11;
    optional ShotConfigResponse shot_config_response = 12;
    optional ModeRequest mode_request = 13;
    optional ModeResponse mode_response = 14;
}

message LaunchAlertDetails {
    optional State state = 1;
    optional Metrics metrics = 2;
    optional Error error = 3;
    optional CalibrationStatus tilt_calibration = 4;
    optional HoleFindStatus hole_find_status = 5;
}

message StatusRequest {}
message StatusResponse {
    optional State state = 1;
}

message WakeUpRequest {}
message WakeUpResponse {
    optional ResponseStatus status = 1;
    enum ResponseStatus {
        SUCCESS = 0;
        ALREADY_AWAKE = 1;
        UNKNOWN_ERROR = 2;
    }
}
message TiltRequest {}
message TiltResponse {
    optional Tilt tilt = 1;
}
message StartTiltCalibrationRequest {}
message StartTiltCalibrationResponse {
    optional CalibrationStatus status = 1;
    enum CalibrationStatus {
        STARTED = 0;
        IN_PROGRESS = 1;
        ERROR = 2;
    }
}
message ResetTiltCalibrationRequest {
    optional bool should_reset = 1;
}
message ResetTiltCalibrationResponse {
    optional Status status = 1;
    enum Status {
        UNKNOWN = 0;
        CAN_RESET = 1;
        ALREADY_RESET = 2;
        RESET_SUCCESSFUL = 3;
        CANNOT_RESET = 4;
    }
}
message ShotConfigRequest {
    optional float temperature = 1;
    optional float humidity = 2;
    optional float altitude = 3;
    optional float air_density = 4;
    optional float tee_range = 5;
}
message ShotConfigResponse {
    optional bool success = 1;
}
message State {
    optional StateType state = 1;

    enum StateType {
        STANDBY = 0;
        INTERFERENCE_TEST = 1;
        WAITING = 2;
        RECORDING = 3;
        PROCESSING = 4;
        ERROR = 5;
    }
}

message CalibrationStatus {
    optional StatusType status = 1;
    optional CalibrationResult result = 2;

    enum StatusType {
        UNKNOWN = 0;
        IN_BOUNDS = 1;
        RECALIBRATION_SUGGESTED = 2;
        RECALIBRATION_REQUIRED = 3;
    }

    enum CalibrationResult {
        SUCCESS = 0;
        ERROR = 1;
        UNIT_MOVING = 2;
    }
}

message Error {
    optional ErrorCode code = 1;
    optional Severity severity = 2;
    optional Tilt deviceTilt = 3;

    enum ErrorCode {
        UNKNOWN = 0;
        OVERHEATING = 1;
        RADAR_SATURATION = 2;
        PLATFORM_TILTED = 3;
    }

    enum Severity {
        WARNING = 0;
        SERIOUS = 1;
        FATAL = 2;
    }
}

message Tilt {
    optional float roll = 1;
    optional float pitch = 2;
}

message HoleFindStatus {
    enum StatusType {
        SEARCHING = 0;
        TRACKING = 1;
        FOUND = 2;
        NOT_FOUND = 3;
    }
    optional StatusType status = 1;
    optional float tracking_percentage = 2;
}

message HolePosition {
    optional float hole_x = 1;
    optional float hole_y = 2;
}

message PuttPath {
    enum BreakDirection {
        LEFT = 0;
        RIGHT = 1;
        STRAIGHT = 2;
    }
    repeated float skidding_x_path_m = 1 [packed = true];
    repeated float skidding_y_path_m = 2 [packed = true];
    repeated float rolling_x_path_m = 3 [packed = true];
    repeated float rolling_y_path_m = 4 [packed = true];
    repeated float extrapolated_x_path_m = 5 [packed = true];
    repeated float extrapolated_y_path_m = 6 [packed = true];
    optional uint32 roll_start_time_ms = 7;
    optional uint32 roll_end_time_ms = 8;
    optional uint32 track_end_time_ms = 9;
    optional bool track_ended_early = 10;
    optional float roll_start_speed = 11;
    optional float skid_distance_m = 12;
    optional float roll_distance_m = 13;
    optional float entry_speed_distance_m = 14;
    optional float break_at_entry_speed = 15;
    optional BreakDirection break_direction_at_entry_speed = 16;
}

message Stimp {
    optional float stimp = 1;
}

message Metrics {
    optional uint32 shot_id = 1;
    optional ShotType shot_type = 2;
    optional BallMetrics ball_metrics = 3;
    optional ClubMetrics club_metrics = 4;
    optional SwingMetrics swing_metrics = 5;
    optional PuttPath putt_path = 6;
    optional HolePosition hole_position = 7;
    optional Stimp stimp = 8;

    enum ShotType {
        PRACTICE = 0;
        NORMAL = 1;
        PUTT = 2;
    }
}

message BallMetrics {
    optional float launch_angle = 1;
    optional float launch_direction = 2;
    optional float ball_speed = 3;
    optional float spin_axis = 4;
    optional float total_spin = 5;
    optional SpinCalculationType spin_calculation_type = 6;
    optional GolfBallType golf_ball_type = 7;
    optional LaunchSpeedType speed_type = 8;

    enum SpinCalculationType {
        SPIN_RATIO = 0;
        SPIN_BALL_FLIGHT = 1;
        SPIN_OTHER = 2;
        SPIN_MEASURED = 3;
    }

    enum GolfBallType {
        BALL_UNKNOWN = 0;
        BALL_CONVENTIONAL = 1;
        BALL_MARKED = 2;
    }

    enum LaunchSpeedType {
        SPEED_MEASURED = 0;
        SPEED_ESTIMATED = 1;
    }
}

message ClubMetrics {
    optional float club_head_speed = 1;
    optional float club_angle_face = 2;
    optional float club_angle_path = 3;
    optional float attack_angle = 4;
    optional float impact_height = 5;
    optional float impact_offset = 6;
}

message SwingMetrics {
    optional uint32 back_swing_start_time = 1;
    optional uint32 down_swing_start_time = 2;
    optional uint32 impact_time = 3;
    optional uint32 follow_through_end_time = 4;
    optional uint32 end_recording_time = 5;
    optional float follow_through_length = 7;
    optional uint32 swing_time = 8;
    optional float swing_plane = 9;
    optional float low_point = 10;
    optional float forward_stroke_length = 11;
}

message ModeRequest {
    enum Mode {
        RANGE = 1;
        PUTTING = 2;
        HOLEFINDING = 3;
        STIMPMEASUREMENT = 4;
    }
    optional Mode mode = 1;
}

message ModeResponse {
    enum Status {
        SUCCESS = 0;
        ALREADY_IN_MODE = 1;
        ERROR = 2;
    }
    optional Status status = 1;
}

syntax = "proto2";

package GDI.Proto.DataTransfer;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiDataTransfer";

import "garmin/gdi_data_types.proto";


message DataDownloadRequest {
    optional uint32 id = 1;
    optional uint32 offset = 2;
    optional uint32 max_chunk_size = 3;
}

message DataDownloadResponse {
    enum Status {
        UNKNOWN = 0;
        SUCCESS = 1;
        INVALID_ID = 2;
        INVALID_OFFSET = 3;
    }
    optional Status status = 1;
    optional uint32 id = 2;
    optional uint32 offset = 3;
    optional bytes payload = 4;
}

message DataTransferService {
    optional DataDownloadRequest data_download_request = 1;
    optional DataDownloadResponse data_download_response = 2;
    optional InitiateDataUploadRequest initiate_data_upload_request = 3;
    optional InitiateDataUploadResponse initiate_data_upload_response = 4;
    optional DataUploadRequest data_upload_request = 5;
    optional DataUploadResponse data_upload_response = 6;
    optional DataUploadCanceledNotification data_upload_canceled_notification = 7;
    optional FileAccessItemRequest file_access_item_request = 8;
    optional FileAccessItemResponse file_access_item_response = 9;
}

message DataUploadCanceledNotification {
    optional uint32 id = 1;
}

message DataUploadRequest {
    optional uint32 id = 1;
    optional uint32 offset = 2;
    optional bytes payload = 3;
}

message DataUploadResponse {
    enum Status {
        UNKNOWN = 0;
        SUCCESS = 1;
        INVALID_ID = 2;
        INVALID_OFFSET = 3;
        SIZE_MISMATCH = 4;
        ABORT = 5;
    }
    optional uint32 id = 1;
    optional Status status = 2;
}

message FileAccessItemRequest {
    enum Latency {
        STANDARD = 0;
        SOON = 1;
        IMMEDIATE = 2;
        DURING_ACTIVITY = 3;
    }
    optional uint32 data_xfer_id = 1;
    optional Latency expected_latency = 2;
}

message FileAccessItemResponse {
    enum Status {
        UNKNOWN = 0;
        OK = 1;
        INVALID_ID = 2;
    }
    optional Status status = 1;
    optional uint32 data_xfer_id = 2;
    optional GDI.Proto.DataTypes.UUID file_access_item_uid = 3;
}

message InitiateDataUploadRequest {
    optional uint32 id = 1;
}

message InitiateDataUploadResponse {
    enum Status {
        UNKNOWN = 0;
        OK = 1;
        INVALID_ID = 2;
    }
    optional uint32 id = 1;
    optional Status status = 2;
}

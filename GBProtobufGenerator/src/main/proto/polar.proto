syntax = "proto2";

package polar;

option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.polar";
option java_outer_classname = "PolarProto";

// Protobuf payloads of Polar's PFTP file transfer protocol (BLE service 0xFEEE),
// as used by the Polar Ignite 3 and related watches.
//
// Message, field and enum numbers were recovered from the field metadata of the
// official Polar Flow app (7.37.1) and verified against BLE HCI captures of a
// real Ignite 3 (firmware 6.0.18).
//
// All fields are optional on purpose, even those the watch treats as required:
// firmware versions omit fields and protobuf-lite would otherwise refuse to
// parse the whole message. Enums whose values could not be recovered are
// declared as int32.

message PbPFtpOperation {
  enum Command {
    GET = 0;
    PUT = 1;
    MERGE = 2;
    REMOVE = 3;
  }
  optional PbPFtpOperation.Command command = 1;
  optional string path = 2;
}

message PbDate {
  optional uint32 year = 1;
  optional uint32 month = 2;
  optional uint32 day = 3;
}

message PbTime {
  optional uint32 hour = 1;
  optional uint32 minute = 2;
  optional uint32 seconds = 3;
  optional uint32 millis = 4;
}

message PbPFtpSetSystemTimeParams {
  optional PbDate date = 1;
  optional PbTime time = 2;
  optional bool trusted = 3;
}

message PbPFtpSetLocalTimeParams {
  optional PbDate date = 1;
  optional PbTime time = 2;
  optional int32 tz_offset = 3;
}

message PbPFtpBatteryStatusResult {
  optional uint32 battery_status = 1;
  optional bool charging = 2;
}

enum PbPFtpSyncTriggerSource {
  NO_SOURCE = 0;
  USER = 1;
  TIMED = 2;
  FEATURE = 3;
}

message PbPFtpSyncTrigger {
  optional PbPFtpSyncTriggerSource source = 1;
  optional string feature_name = 2;
}

message PbPFtpSyncRequiredParams {
  repeated PbPFtpSyncTrigger sync_triggers = 1;
}

message PbSystemDateTime {
  optional PbDate date = 1;
  optional PbTime time = 2;
  optional bool trusted = 3;
}

message PbPFtpEntry {
  optional string name = 1;
  optional uint64 size = 2;
  optional PbSystemDateTime created = 3;
  optional PbSystemDateTime modified = 4;
  optional PbSystemDateTime touched = 5;
}

message PbPFtpDirectory {
  repeated PbPFtpEntry entries = 1;
}

message PbVersion {
  optional uint32 major = 1;
  optional uint32 minor = 2;
  optional uint32 patch = 3;
  optional string specifier = 4;
}

message PbAlgorithmVersion {
  optional PbVersion ohr_version = 1;
}

message PbFontInfo {
  optional string file_name = 1;
  optional uint32 version = 2;
}

message PbSubcomponentInfo {
  optional string name = 1;
  optional PbVersion OBSOLETE_required_version = 2;
  optional PbVersion version = 3;
}

message PbDeviceInfo {
  enum PbDisplayShape {
    RECTANGLE = 0;
    FULLY_ROUND = 1;
    ROUND_FLAT_BOTTOM = 2;
  }
  optional PbVersion bootloader_version = 1;
  optional PbVersion platform_version = 2;
  optional PbVersion device_version = 3;
  optional uint32 svn_rev = 4;
  optional string electrical_serial_number = 5;
  optional string deviceID = 6;
  optional string model_name = 7;
  optional string hardware_code = 8;
  optional string product_color = 9;
  optional string product_design = 10;
  optional string system_id = 11;
  optional bytes git_hash = 12;
  optional PbVersion polarmathsmart_version = 13;
  repeated PbSubcomponentInfo sub_component_info = 14;
  optional PbDeviceInfo.PbDisplayShape display_shape = 15;
  optional PbAlgorithmVersion algorithm_version = 16;
  repeated PbFontInfo font_info = 17;
  repeated string capabilities = 18;
  optional string sales_region = 19;
}

enum Action {
  CREATED = 0;
  UPDATED = 1;
  REMOVED = 2;
}

enum PbPftpPnsHDAttributeType {
  TITLE = 0;
  SUBTITLE = 1;
  MESSAGE = 2;
  POSITIVE_ACTION_LABEL = 3;
  NEGATIVE_ACTION_LABEL = 4;
  APPLICATION_NAME = 5;
  CLEAR_ACTION_LABEL = 6;
  A_ACTION_LABEL = 7;
  B_ACTION_LABEL = 8;
  C_ACTION_LABEL = 9;
  D_ACTION_LABEL = 10;
}

message PbPftpPnsHDAttribute {
  optional PbPftpPnsHDAttributeType type = 1;
  optional string data = 2;
  optional uint32 attribute_full_size = 3;
}

enum PbPftpPnsHDCategoryID {
  CATEGORY_ID_OTHER = 0;
  CATEGORY_ID_POLAR = 1;
  CATEGORY_ID_INCOMINGCALL = 2;
  CATEGORY_ID_MISSEDCALL = 3;
  CATEGORY_ID_VOICEMAIL = 4;
  CATEGORY_ID_SOCIAL = 5;
  CATEGORY_ID_SCHEDULE = 6;
  CATEGORY_ID_EMAIL = 7;
  CATEGORY_ID_NEWS = 8;
  CATEGORY_ID_HEALTHANDFITNESS = 9;
  CATEGORY_ID_BUSINESSANDFINANCE = 10;
  CATEGORY_ID_LOCATION = 11;
  CATEGORY_ID_ENTERTAINMENT = 12;
  CATEGORY_ID_ALARM = 13;
  CATEGORY_ID_PROMO = 14;
  CATEGORY_ID_RECOMMENDATION = 15;
  CATEGORY_ID_STATUS = 16;
  CATEGORY_ID_TRANSPORT = 17;
}

message PbLocalDateTime {
  optional PbDate date = 1;
  optional PbTime time = 2;
  optional bool OBSOLETE_trusted = 3;
  optional int32 time_zone_offset = 4;
}

message PbPftpPnsHDNotification {
  optional uint32 notification_id = 1;
  optional PbPftpPnsHDCategoryID category_id = 2;
  optional Action action = 3;
  optional PbLocalDateTime issue_time = 4;
  optional uint32 new_same_category_notifications = 5;
  optional uint32 unread_same_category_notifications = 6;
  repeated PbPftpPnsHDAttribute attributes = 7;
}

enum PbPftpPnsDHAttributeType {
  UNKNOWN_ACTION = 1;
  POSITIVE_ACTION = 2;
  NEGATIVE_ACTION = 3;
  CLEAR_ACTION = 4;
  A_ACTION = 5;
  B_ACTION = 6;
  C_ACTION = 7;
  D_ACTION = 8;
}

message PbPftpPnsDHAttribute {
  optional PbPftpPnsDHAttributeType type = 1;
}

message PbPftpPnsDHNotificationResponse {
  optional uint32 notification_id = 1;
  repeated PbPftpPnsDHAttribute attributes = 2;
}

enum MediaControlCommand {
  PLAY = 1;
  PAUSE = 2;
  TOGGLER_PLAY_PAUSE = 3;
  NEXT = 4;
  PREVIOUS = 5;
  FAST_FORWARD = 6;
  FAST_BACKWARD = 7;
  VOLUME_UP = 8;
  VOLUME_DOWN = 9;
}

message PbPFtpHDMediaData {
  repeated MediaControlCommand commands = 1;
  optional string playerName = 2;
  optional string artistName = 3;
  optional string trackName = 4;
  optional float track_duration = 5;
}

enum PlaybackState {
  STATE_NONE = 1;
  STATE_STOPPED = 2;
  STATE_PLAYING = 3;
  STATE_PAUSED = 4;
  STATE_FAST_FORWARDING = 5;
  STATE_REWINDING = 6;
  STATE_BUFFERING = 7;
  STATE_ERROR = 8;
  STATE_CONNECTING = 9;
  STATE_SKIPPING_TO_PREVIOUS = 10;
  STATE_SKIPPING_TO_NEXT = 11;
  STATE_SKIPPING_TO_QUEUE_ITEM = 12;
}

message PbPFtpHDMediaControlPlaybackState {
  optional PlaybackState playback_state = 1;
  optional float playback_rate = 2;
  optional float elapsed_time = 3;
  optional uint32 volume_level = 4;
}

message PbPftpDHMediaControlCommand {
  optional MediaControlCommand command = 1;
}

enum MediaControlRequest {
  GET_MEDIA_DATA = 1;
  GET_PLAYBACK_STATE = 2;
}

message PbPftpDHMediaControlRequest {
  optional MediaControlRequest request = 1;
}

message PbPftpDHMediaControlEnabled {
  optional bool enabled = 1;
}
